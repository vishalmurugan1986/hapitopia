<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 380" width="1000" height="760">
  <defs>
    <!-- Petal 1: Emerald (Physical) -->
    <linearGradient id="logoPetalEmerald" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Petal 2: Magenta (Mental) -->
    <linearGradient id="logoPetalMagenta" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#BE185D"/>
    </linearGradient>

    <!-- Petal 3: Gold (Financial) -->
    <linearGradient id="logoPetalGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Petal 4: Rose (Emotional) -->
    <linearGradient id="logoPetalRose" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>

    <!-- Petal 5: Cyan (Intellectual) -->
    <linearGradient id="logoPetalCyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>

    <!-- Center Golden Core -->
    <radialGradient id="logoCoreGold" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </radialGradient>

    <!-- Shadow -->
    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- 5-Petal Flower Top -->
  <g transform="translate(250, 140)" filter="url(#logoShadow)">
    <g transform="rotate(0)">
      <ellipse cx="0" cy="-60" rx="30" ry="54" fill="url(#logoPetalEmerald)"/>
      <ellipse cx="0" cy="-68" rx="13" ry="32" fill="#FFFFFF" fill-opacity="0.25"/>
    </g>
    <g transform="rotate(72)">
      <ellipse cx="0" cy="-60" rx="30" ry="54" fill="url(#logoPetalMagenta)"/>
      <ellipse cx="0" cy="-68" rx="13" ry="32" fill="#FFFFFF" fill-opacity="0.25"/>
    </g>
    <g transform="rotate(144)">
      <ellipse cx="0" cy="-60" rx="30" ry="54" fill="url(#logoPetalGold)"/>
      <ellipse cx="0" cy="-68" rx="13" ry="32" fill="#FFFFFF" fill-opacity="0.25"/>
    </g>
    <g transform="rotate(216)">
      <ellipse cx="0" cy="-60" rx="30" ry="54" fill="url(#logoPetalRose)"/>
      <ellipse cx="0" cy="-68" rx="13" ry="32" fill="#FFFFFF" fill-opacity="0.25"/>
    </g>
    <g transform="rotate(288)">
      <ellipse cx="0" cy="-60" rx="30" ry="54" fill="url(#logoPetalCyan)"/>
      <ellipse cx="0" cy="-68" rx="13" ry="32" fill="#FFFFFF" fill-opacity="0.25"/>
    </g>

    <!-- Core -->
    <circle cx="0" cy="0" r="42" fill="none" stroke="#FEF08A" stroke-width="3" stroke-opacity="0.8"/>
    <circle cx="0" cy="0" r="39" fill="url(#logoCoreGold)"/>
    <text x="0" y="8" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="25" fill="#451A03" letter-spacing="-0.5">5&#215;7</text>
  </g>

  <!-- Wordmark: Habitopia -->
  <text x="250" y="295" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="44" fill="#0F172A" letter-spacing="-0.5">Habitopia</text>

  <!-- Tagline: Build a future-proof child -->
  <text x="250" y="332" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="700" font-size="14.5" fill="#64748B" letter-spacing="1.5">BUILD A FUTURE-PROOF CHILD</text>
</svg>
