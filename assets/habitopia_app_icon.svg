<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E1424"/>
      <stop offset="100%" stop-color="#060913"/>
    </linearGradient>

    <!-- Center Specular Aura -->
    <radialGradient id="centerAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#10B981" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0E1424" stop-opacity="0"/>
    </radialGradient>

    <!-- Petal 1: Emerald (Physical) -->
    <linearGradient id="petalEmerald" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Petal 2: Magenta (Mental) -->
    <linearGradient id="petalMagenta" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#BE185D"/>
    </linearGradient>

    <!-- Petal 3: Gold (Financial) -->
    <linearGradient id="petalGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Petal 4: Rose (Emotional) -->
    <linearGradient id="petalRose" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>

    <!-- Petal 5: Cyan (Intellectual) -->
    <linearGradient id="petalCyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>

    <!-- Center Golden Core -->
    <radialGradient id="coreGold" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Base Canvas -->
  <rect width="1024" height="1024" rx="228" fill="url(#iconBg)"/>
  <circle cx="512" cy="512" r="380" fill="url(#centerAura)"/>

  <!-- 5-Petal Habit Flower -->
  <g transform="translate(512, 512)" filter="url(#shadow)">
    <!-- Petal 0: Top (Emerald - Physical) -->
    <g transform="rotate(0)">
      <ellipse cx="0" cy="-185" rx="100" ry="175" fill="url(#petalEmerald)"/>
      <ellipse cx="0" cy="-210" rx="42" ry="105" fill="#FFFFFF" fill-opacity="0.22"/>
    </g>
    <!-- Petal 1: 72 deg (Magenta - Mental) -->
    <g transform="rotate(72)">
      <ellipse cx="0" cy="-185" rx="100" ry="175" fill="url(#petalMagenta)"/>
      <ellipse cx="0" cy="-210" rx="42" ry="105" fill="#FFFFFF" fill-opacity="0.22"/>
    </g>
    <!-- Petal 2: 144 deg (Gold - Financial) -->
    <g transform="rotate(144)">
      <ellipse cx="0" cy="-185" rx="100" ry="175" fill="url(#petalGold)"/>
      <ellipse cx="0" cy="-210" rx="42" ry="105" fill="#FFFFFF" fill-opacity="0.22"/>
    </g>
    <!-- Petal 3: 216 deg (Rose - Emotional) -->
    <g transform="rotate(216)">
      <ellipse cx="0" cy="-185" rx="100" ry="175" fill="url(#petalRose)"/>
      <ellipse cx="0" cy="-210" rx="42" ry="105" fill="#FFFFFF" fill-opacity="0.22"/>
    </g>
    <!-- Petal 4: 288 deg (Cyan - Intellectual) -->
    <g transform="rotate(288)">
      <ellipse cx="0" cy="-185" rx="100" ry="175" fill="url(#petalCyan)"/>
      <ellipse cx="0" cy="-210" rx="42" ry="105" fill="#FFFFFF" fill-opacity="0.22"/>
    </g>

    <!-- Center Radiant Core -->
    <circle cx="0" cy="0" r="132" fill="none" stroke="#FEF08A" stroke-width="8" stroke-opacity="0.75"/>
    <circle cx="0" cy="0" r="124" fill="url(#coreGold)"/>

    <!-- 5x7 Typography -->
    <text x="0" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="80" fill="#451A03" letter-spacing="-1">5&#215;7</text>
  </g>
</svg>
